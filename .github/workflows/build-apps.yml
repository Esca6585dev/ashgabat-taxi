# Builds the client and driver apps: Android APKs + web builds, published as a GitHub Release.
#
# Server address baked into the APKs (users can still change it in the app, gear icon on the login screen):
#   - "Run workflow" input api_url, or
#   - repository variable API_URL (Settings → Secrets and variables → Actions → Variables).
# Optional release key (otherwise the APK is signed with a debug key, fine for direct install):
#   secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Build apps

on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/build-apps.yml"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server address for the APKs, e.g. https://api.taxi.tm"
        required: false

permissions:
  contents: write

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_URL: ${{ inputs.api_url || vars.API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Test shared library
        working-directory: apps/taxi_core
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Release key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release key: APKs are signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          for app in client_app driver_app; do
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "apps/$app/android/key.properties"
          done

      - name: Build
        run: |
          set -e
          mkdir -p dist
          define=""
          if [ -n "$API_URL" ]; then define="--dart-define=API_URL=$API_URL"; fi
          for app in client_app driver_app; do
            ( cd apps/$app
              flutter pub get
              flutter analyze
              flutter build apk --release $define
              base=$([ "$app" = client_app ] && echo /app/ || echo /driver/)
              # web is served by the backend itself, so it talks to its own origin
              flutter build web --release --no-web-resources-cdn --base-href "$base" )
          done
          cp apps/client_app/build/app/outputs/flutter-apk/app-release.apk dist/ashgabat-taxi-musderi.apk
          cp apps/driver_app/build/app/outputs/flutter-apk/app-release.apk dist/ashgabat-taxi-suruji.apk
          ( cd apps/client_app/build && mv web client_web && zip -qr ../../../dist/web-musderi.zip client_web )
          ( cd apps/driver_app/build && mv web driver_web && zip -qr ../../../dist/web-suruji.zip driver_web )
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ashgabat-taxi-apps
          path: dist/*

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apps-v${{ github.run_number }}
          name: Programmalar ${{ github.run_number }}
          make_latest: true
          body: |
            **Müşderi:** `ashgabat-taxi-musderi.apk` · **Sürüji:** `ashgabat-taxi-suruji.apk`
            Web: `web-musderi.zip` we `web-suruji.zip` serwerdäki `web-apps/` bukjasyna açyň → `http://SERWER:8080/app/` we `/driver/` (docs/ADIMLER.md).

            Serweriň salgysy: `${{ env.API_URL || 'bellenmedi — programmada ⚙ arkaly giriziň' }}`
            Commit: ${{ github.sha }}
          files: dist/*
