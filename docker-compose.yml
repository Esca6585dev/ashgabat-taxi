services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: taxi_secret
      POSTGRES_DB: taxi
      TZ: Asia/Ashgabat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-change-me-please}
      DB_DRIVER: postgres
      DB_DSN: host=db user=taxi password=taxi_secret dbname=taxi port=5432 sslmode=disable TimeZone=Asia/Ashgabat
      ADMIN_PHONE: ${ADMIN_PHONE:-+99360000000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_TOKEN: ${SMS_HTTP_TOKEN:-}
      SMPP_IP: ${SMPP_IP:-}
      SMPP_PORT: ${SMPP_PORT:-}
      SMPP_FROM: ${SMPP_FROM:-}
      SMPP_USERNAME: ${SMPP_USERNAME:-}
      SMPP_PASSWORD: ${SMPP_PASSWORD:-}
      SMPP_DST_FORMAT: ${SMPP_DST_FORMAT:-993}
      OTP_FIXED_CODE: ${OTP_FIXED_CODE:-}
      OSRM_URL: ${OSRM_URL:-}
      COMMISSION_RATE: ${COMMISSION_RATE:-0.10}
      DEFAULT_DRIVER_PLAN: ${DEFAULT_DRIVER_PLAN:-commission}
      MONTHLY_FEE: ${MONTHLY_FEE:-300}
      DRIVER_MIN_BALANCE: ${DRIVER_MIN_BALANCE:--50}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
      PAYMENT_RBS_URL: ${PAYMENT_RBS_URL:-https://mpi.gov.tm/payment/rest}
      PAYMENT_RBS_USERNAME: ${PAYMENT_RBS_USERNAME:-}
      PAYMENT_RBS_PASSWORD: ${PAYMENT_RBS_PASSWORD:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-+99312000000}
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
      CLIENT_WEB_DIR: /app/web-apps/client_web
      DRIVER_WEB_DIR: /app/web-apps/driver_web
    ports:
      - "8080:8080"
    # web versions of the apps (unzip the release web-*.zip files into ./web-apps)
    volumes:
      - ./web-apps:/app/web-apps:ro
      # Firebase key for push: put firebase-key.json next to this file and set FCM_CREDENTIALS_FILE=/app/secrets/firebase-key.json in .env
      - ./secrets:/app/secrets:ro
    restart: unless-stopped

  # Optional: self-hosted routing for real road distances (needs an OSM extract of Turkmenistan).
  # 1) download https://download.geofabrik.de/asia/turkmenistan-latest.osm.pbf into ./osrm/
  # 2) run the three preprocessing commands from docs/ADIMLER.md, then enable this service and set OSRM_URL=http://osrm:5000
  # osrm:
  #   image: osrm/osrm-backend
  #   command: osrm-routed --algorithm mld /data/turkmenistan-latest.osrm
  #   volumes:
  #     - ./osrm:/data

  # HTTPS (recommended): docker compose --profile https up -d   — needs DOMAIN in .env
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
